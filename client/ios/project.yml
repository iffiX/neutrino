# The iOS app's project. `xcodegen generate` writes Neutrino.xcodeproj from
# this file before every build; the version and the edition come in as the
# build settings MARKETING_VERSION, CURRENT_PROJECT_VERSION and
# NEUTRINO_EDITION, which packaging/build/build_client_ios.py passes. The app
# target also reads Neutrino.xcconfig, which links the RustDesk core into a
# device build when cores/rustdesk/ holds it. Every target finds the
# transport's Mobile.xcframework once packaging/build/build_core_transport.py
# has put it into cores/transport/.
name: Neutrino
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2
    exactVersion: 4.0.3
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": >-
      $(inherited) "$(SRCROOT)/cores/transport/Mobile.xcframework/ios-arm64"
    "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": >-
      $(inherited) "$(SRCROOT)/cores/transport/Mobile.xcframework/ios-arm64_x86_64-simulator"
targets:
  Neutrino:
    type: application
    platform: iOS
    sources:
      - path: Neutrino
      - path: app_locales
        type: folder
        buildPhase: resources
      - path: ../desktop/frontend/locales
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: AMSMB2
        embed: true
      - sdk: libresolv.tbd
    configFiles:
      Debug: Neutrino.xcconfig
      Release: Neutrino.xcconfig
    info:
      path: Neutrino/Info.plist
      properties:
        CFBundleDisplayName: Neutrino
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NeutrinoEdition: $(NEUTRINO_EDITION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: io.github.iffix.neutrino.link
            CFBundleURLSchemes: [neutrino]
        NSCameraUsageDescription: The camera reads the QR code on the hub's Clients page.
        NSLocalNetworkUsageDescription: The app reaches your hubs on this network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iffix.neutrino
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rustdesk_core
  NeutrinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeutrinoTests
    dependencies:
      - target: Neutrino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iffix.neutrino.tests
        GENERATE_INFOPLIST_FILE: YES
  NeutrinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NeutrinoUITests
    dependencies:
      - target: Neutrino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.iffix.neutrino.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Neutrino:
    build:
      targets:
        Neutrino: all
        NeutrinoTests: [test]
        NeutrinoUITests: [test]
    test:
      targets:
        - NeutrinoTests
        - NeutrinoUITests
