# The app's version, written here and nowhere else.
neutrinoVersion=0.6.0

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Dependency downloads: their timeouts and their tries after a timeout or a 5xx.
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=8
org.gradle.internal.repository.initial.backoff=2000
