[project]
name = "neutrino-agent"
version = "0.2.1"
description = "The Neutrino device agent: keeps a managed machine's modules in the state its hub asks for"
requires-python = ">=3.9"
# Deliberately empty, and it stays that way: the agent's own code is
# standard library, and the packages carry the interpreter that runs it.
dependencies = []

[project.scripts]
nagent = "neutrino_agent.cli.entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neutrino_agent*"]

[tool.setuptools.package-data]
neutrino_agent = ["data/systemd/*"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
