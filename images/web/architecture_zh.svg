<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" width="1020" height="590" role="img" aria-label="家外的机器只经虚拟网络到达一台 Neutrino hub；家里由 hub 配置网络、AI 网关、存储、服务和每台机器">
  <title>Neutrino：家里一台 hub，从外面只经虚拟网络到达</title>

  <defs>
    <!-- Pink out there, cyan in here: the gradient runs the way the reader
         travels, from the world that blocks them to the one they control. -->
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0158a"/>
      <stop offset="50%" stop-color="#c040d0"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="inbound" gradientUnits="userSpaceOnUse" x1="510" y1="204" x2="510" y2="246">
      <stop offset="0%" stop-color="#f0158a"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1020" height="590" fill="#000000"/>

  <!-- Outside: machines that travel, and reach home only over the overlay. -->
  <text x="510" y="34" fill="#f0158a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">外部 · 经公共互联网</text>

  <g>
    <rect x="150" y="54" width="200" height="62" rx="10" fill="#0c060a" stroke="#f0158a" stroke-width="5" opacity="0.18"/>
    <rect x="150" y="54" width="200" height="62" rx="10" fill="none" stroke="#f0158a" stroke-width="1.4"/>
    <text x="250" y="83" fill="#ffe6f4" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">笔记本</text>
    <text x="250" y="102" fill="#b58aa4" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">咖啡馆、酒店、火车上</text>

    <rect x="410" y="54" width="200" height="62" rx="10" fill="#0c060a" stroke="#f0158a" stroke-width="5" opacity="0.18"/>
    <rect x="410" y="54" width="200" height="62" rx="10" fill="none" stroke="#f0158a" stroke-width="1.4"/>
    <text x="510" y="83" fill="#ffe6f4" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">手机 · 平板</text>
    <text x="510" y="102" fill="#b58aa4" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">面板就是一个网页</text>

    <rect x="670" y="54" width="200" height="62" rx="10" fill="#0c060a" stroke="#f0158a" stroke-width="5" opacity="0.18"/>
    <rect x="670" y="54" width="200" height="62" rx="10" fill="none" stroke="#f0158a" stroke-width="1.4"/>
    <text x="770" y="83" fill="#ffe6f4" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">公司的电脑</text>
    <text x="770" y="102" fill="#b58aa4" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">客户端：打开、挂载、连接</text>
  </g>

  <!-- The public Internet: crossed, never trusted. -->
  <line x1="40" y1="146" x2="980" y2="146" stroke="#f0158a" stroke-width="2" stroke-dasharray="4 7" stroke-linecap="round" opacity="0.95"/>
  <text x="980" y="138" fill="#f0158a" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="11" text-anchor="end" letter-spacing="1">公共互联网</text>

  <!-- Three tunnels converge on the overlay, and only the overlay reaches the hub. -->
  <g fill="none" stroke="#f0158a" stroke-width="2" stroke-dasharray="8 6" stroke-linecap="round" opacity="0.9">
    <path d="M 250 118 C 250 150 440 150 470 172"/>
    <path d="M 510 118 L 510 170"/>
    <path d="M 770 118 C 770 150 580 150 550 172"/>
  </g>
  <g>
    <rect x="400" y="172" width="220" height="30" rx="15" fill="#0c060a" stroke="#c040d0" stroke-width="1.4"/>
    <text x="510" y="192" fill="#ecd2f5" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle">NetBird · EasyTier 虚拟网络</text>
  </g>
  <g>
    <path d="M 510 204 L 510 244" fill="none" stroke="url(#inbound)" stroke-width="8" opacity="0.22"/>
    <path d="M 510 204 L 510 240" fill="none" stroke="url(#inbound)" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
    <path d="M 510 246 l -6 -12 l 12 0 z" fill="#8b5cf6"/>
  </g>

  <!-- The hub, where the two worlds meet. The wordmark leans the way it does
       on the banner; skewX guarantees it rather than trusting a font to
       carry an italic the reader's machine may not have. -->
  <g>
    <rect x="380" y="248" width="260" height="140" rx="16" fill="#07080c" stroke="url(#wordmark)" stroke-width="9" opacity="0.2"/>
    <rect x="380" y="248" width="260" height="140" rx="16" fill="none" stroke="url(#wordmark)" stroke-width="2"/>
    <g transform="translate(510 300) skewX(-12)">
      <text x="0" y="0" fill="url(#wordmark)" font-family="Inter, Montserrat, system-ui, 'Helvetica Neue', sans-serif" font-size="36" font-weight="800" font-style="italic" letter-spacing="1" text-anchor="middle">NEUTRINO</text>
    </g>
    <g transform="translate(510 325) skewX(-12)">
      <text x="0" y="0" fill="#c040d0" font-family="Inter, Montserrat, system-ui, sans-serif" font-size="14" font-weight="700" font-style="italic" letter-spacing="6" text-anchor="middle">HUB</text>
    </g>
    <line x1="416" y1="340" x2="604" y2="340" stroke="#2b3648" stroke-width="1"/>
    <text x="510" y="361" fill="#8fa3b8" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle">一台常开的 Linux 小机器</text>
    <text x="510" y="378" fill="#8fa3b8" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="12.5" text-anchor="middle">树莓派或电视盒子就够</text>
  </g>

  <!-- Inside: everything the hub configures, and every machine that inherits it. -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round">
    <path d="M 510 388 L 510 424"/>
    <path d="M 130 424 L 890 424"/>
    <path d="M 130 424 L 130 462"/>
    <path d="M 320 424 L 320 462"/>
    <path d="M 510 424 L 510 462"/>
    <path d="M 700 424 L 700 462"/>
    <path d="M 890 424 L 890 462"/>
  </g>
  <g fill="#22d3ee">
    <path d="M 130 466 l -4.5 -10 l 9 0 z"/>
    <path d="M 320 466 l -4.5 -10 l 9 0 z"/>
    <path d="M 510 466 l -4.5 -10 l 9 0 z"/>
    <path d="M 700 466 l -4.5 -10 l 9 0 z"/>
    <path d="M 890 466 l -4.5 -10 l 9 0 z"/>
  </g>

  <g>
    <rect x="42" y="468" width="176" height="64" rx="10" fill="#06090d" stroke="#22d3ee" stroke-width="5" opacity="0.16"/>
    <rect x="42" y="468" width="176" height="64" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="130" y="495" fill="#e6f6ff" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">网络</text>
    <text x="130" y="515" fill="#7c9bb5" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="11.5" text-anchor="middle">路由 · 代理 · DNS · DHCP</text>

    <rect x="232" y="468" width="176" height="64" rx="10" fill="#06090d" stroke="#22d3ee" stroke-width="5" opacity="0.16"/>
    <rect x="232" y="468" width="176" height="64" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="320" y="495" fill="#e6f6ff" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">被控端</text>
    <text x="320" y="515" fill="#7c9bb5" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="11.5" text-anchor="middle">NAS · 工作站 · GPU 机</text>

    <rect x="422" y="468" width="176" height="64" rx="10" fill="#06090d" stroke="#22d3ee" stroke-width="5" opacity="0.16"/>
    <rect x="422" y="468" width="176" height="64" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="510" y="495" fill="#e6f6ff" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">存储</text>
    <text x="510" y="515" fill="#7c9bb5" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="11.5" text-anchor="middle">ZFS 池 · Samba 共享</text>

    <rect x="612" y="468" width="176" height="64" rx="10" fill="#06090d" stroke="#22d3ee" stroke-width="5" opacity="0.16"/>
    <rect x="612" y="468" width="176" height="64" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="700" y="495" fill="#e6f6ff" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">服务</text>
    <text x="700" y="515" fill="#7c9bb5" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="11.5" text-anchor="middle">Gitea · 容器 · 你自己的</text>

    <rect x="802" y="468" width="176" height="64" rx="10" fill="#06090d" stroke="#22d3ee" stroke-width="5" opacity="0.16"/>
    <rect x="802" y="468" width="176" height="64" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="890" y="495" fill="#e6f6ff" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">AI 网关</text>
    <text x="890" y="515" fill="#7c9bb5" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="11.5" text-anchor="middle">账号 · 密钥 · 计量</text>
  </g>

  <text x="510" y="566" fill="#22d3ee" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', Inter, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">内部 · 在你自己的网络里</text>
</svg>
