<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 574" role="img" aria-label="At home, a server and a desktop each run an agent that dials the hub's port 8443; a phone away from home reaches the same port 8443 by one of four ways in: direct, SSH Relay, NetBird or EasyTier."><title>At home, a server and a desktop each run an agent that dials the hub's port 8443; a phone away from home reaches the same port 8443 by one of four ways in: direct, SSH Relay, NetBird or EasyTier.</title><style>text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Noto Sans&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif;fill:#0f172a;text-anchor:middle}.b{font-size:17px;font-weight:600}.s{font-size:14px;fill:#334155}.t{font-size:16px;font-weight:600;text-anchor:start}.a{fill:#0e7490}.area{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}.box{fill:#fff;stroke:#64748b;stroke-width:1.5}.acc{fill:#ecfeff;stroke:#0891b2;stroke-width:2}.pill{fill:#fff;stroke:#cbd5e1;stroke-width:1}.ln{fill:none;stroke:#64748b;stroke-width:2}.la{fill:none;stroke:#0891b2;stroke-width:2.5}.dash{stroke-dasharray:7 5}</style><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0891b2"/></marker></defs><rect x="195" y="10" width="310" height="64" rx="8" class="box"/><text x="350.0" y="38.0" class="b">Phone away from home</text><text x="350.0" y="58.0" class="s">client · shows every machine's services</text><rect x="10" y="236" width="680" height="284" rx="12" class="area dash"/><text x="28" y="262" class="t">Home LAN</text><rect x="230" y="320" width="240" height="136" rx="8" class="box"/><text x="350" y="368" class="b">The hub's computer</text><rect x="248" y="390" width="96" height="44" rx="8" class="acc"/><text x="296.0" y="418.0" class="b">hub</text><rect x="356" y="390" width="96" height="44" rx="8" class="box"/><text x="404.0" y="418.0" class="b">agent</text><rect x="310" y="300" width="80" height="40" rx="8" class="acc"/><text x="350.0" y="326.0" class="b a">8443</text><rect x="30" y="390" width="170" height="64" rx="8" class="box"/><text x="115.0" y="418.0" class="b">Server</text><text x="115.0" y="438.0" class="s">agent</text><rect x="500" y="390" width="170" height="64" rx="8" class="box"/><text x="585.0" y="418.0" class="b">Desktop</text><text x="585.0" y="438.0" class="s">agent</text><path d="M115 390V320H308" class="ln" marker-end="url(#g)"/><path d="M585 390V320H392" class="ln" marker-end="url(#g)"/><rect x="250.0" y="473" width="200" height="30" rx="15" class="pill"/><text x="350" y="493" class="s">the agent dials the hub</text><path d="M350 74L92 116" class="la" marker-end="url(#c)"/><rect x="10" y="118" width="164" height="84" rx="8" class="box"/><text x="92.0" y="146.0" class="b a">Direct</text><text x="92.0" y="166.0" class="s">a port forward on</text><text x="92.0" y="186.0" class="s">the home router</text><path d="M92 202L350 298" class="la" marker-end="url(#c)"/><path d="M350 74L264 116" class="la" marker-end="url(#c)"/><rect x="182" y="118" width="164" height="84" rx="8" class="box"/><text x="264.0" y="156.0" class="b a">SSH Relay</text><text x="264.0" y="176.0" class="s">your VPS</text><path d="M264 202L350 298" class="la" marker-end="url(#c)"/><path d="M350 74L436 116" class="la" marker-end="url(#c)"/><rect x="354" y="118" width="164" height="84" rx="8" class="box"/><text x="436.0" y="156.0" class="b a">NetBird</text><text x="436.0" y="176.0" class="s">virtual network</text><path d="M436 202L350 298" class="la" marker-end="url(#c)"/><path d="M350 74L608 116" class="la" marker-end="url(#c)"/><rect x="526" y="118" width="164" height="84" rx="8" class="box"/><text x="608.0" y="156.0" class="b a">EasyTier</text><text x="608.0" y="176.0" class="s">virtual network</text><path d="M608 202L350 298" class="la" marker-end="url(#c)"/><rect x="190.0" y="535" width="320" height="30" rx="15" class="pill"/><text x="350" y="555" class="b">All four reach the same port 8443</text></svg>
