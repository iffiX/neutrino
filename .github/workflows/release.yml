name: release

# A tag builds everything and opens a draft; the notes are written by a person.
# workflow_dispatch builds the same packages and attaches them as artifacts
# without touching releases, which is how the pipeline is tried out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hub:
    name: hub .deb (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      # The panel is gitignored, and hub/packaging/build_deb.py refuses to
      # package a hub without it. Vite writes straight into the package.
      - run: npm ci
        working-directory: hub/frontend

      - run: npm run build
        working-directory: hub/frontend

      # The hub is built inside debian:12, which for arm64 means running that
      # container under emulation on an x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build_release.py
          --only hub
          --architecture ${{ matrix.architecture }}
          --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: hub_${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  agent:
    name: agent .deb and .rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # rpmbuild is not on the runner image. Debian family calls the package
      # `rpm`; without it the build writes the .deb and says it skipped the
      # .rpm, which would pass silently.
      - run: sudo apt-get install -y --no-install-recommends rpm

      # Both packages are architecture-independent and need no interpreter to
      # match, so the runner's own python3 is the whole toolchain.
      - run: python3 packaging/build_release.py --only agent --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: agent_packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  agent_windows:
    name: agent installer (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # Inno Setup and a Python to run the build with are both on the image.
      - run: python agent/packaging/build_exe.py --output-dir dist

      # The installer is what ships, so it is run here rather than only
      # compiled: whether the task registers, whether the bundled interpreter
      # finds the agent beside it, and whether uninstalling cleans up.
      - name: Install it, use it, remove it
        shell: pwsh
        run: |
          # A native command exiting non-zero is a value to test here, not an
          # error to stop on: the agent reports an unenrolled machine that way.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $setup = (Get-ChildItem dist\*-setup.exe)[0].FullName
          Start-Process -FilePath $setup -Wait `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'

          # What the task ended up storing is the one thing the quoting in the
          # Inno script can get wrong without anything else noticing.
          $task = Get-ScheduledTask -TaskName 'Neutrino Agent'
          $task.Actions | Format-List
          if ($task.Actions[0].Execute -notlike '*nagent_service.cmd*') {
            throw "the task runs $($task.Actions[0].Execute)"
          }

          # Unenrolled, the agent says so and exits 1. Reaching that message
          # means the bundled interpreter imported it.
          & "$env:ProgramFiles\Neutrino Agent\nagent.cmd" --once
          if ($LASTEXITCODE -ne 1) {
            throw "nagent --once exited $LASTEXITCODE, expected 1"
          }

          Start-Process -FilePath "$env:ProgramFiles\Neutrino Agent\unins000.exe" `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'

          # Inno's uninstaller re-runs itself from a copy and the first process
          # returns at once, so the task going away is what says it finished.
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            if (-not (Get-ScheduledTask -TaskName 'Neutrino Agent' `
                        -ErrorAction SilentlyContinue)) { break }
            Start-Sleep -Seconds 3
          }
          if (Get-ScheduledTask -TaskName 'Neutrino Agent' `
                -ErrorAction SilentlyContinue) {
            throw 'the task outlived the uninstaller'
          }

          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: agent_windows
          path: dist/*.exe
          if-no-files-found: error

  draft:
    name: checksums and draft release
    needs: [hub, agent, agent_windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS covers every package at once, so it is written here rather
      # than by the jobs that each produced one file.
      - run: python3 packaging/build_release.py --only checksums --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: release_dist
          path: dist/*

      - name: Open the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix is a pre-release, so the hub's update check
          # passes over it.
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --draft ${prerelease} \
            --title "${GITHUB_REF_NAME}" \
            --notes "" \
            dist/*
