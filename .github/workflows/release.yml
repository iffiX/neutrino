name: release

# A tag builds everything and opens a draft; the notes are written by a person.
# workflow_dispatch builds the same packages and attaches them as artifacts
# without touching releases, which is how the pipeline is tried out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: "also build the Windows installer (not part of a release yet)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  hub:
    name: hub .deb, .rpm and Arch (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      # The panel is gitignored, and hub/packaging/build_deb.py refuses to
      # package a hub without it. Vite writes straight into the package.
      - run: npm ci
        working-directory: hub/frontend

      - run: npm run build
        working-directory: hub/frontend

      # The hub is built inside debian:12, which for arm64 means running that
      # container under emulation on an x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      # A tag stamps the hub's agent manifest with where the release
      # publishes each package; a dispatch build carries no URL.
      - run: >
          python3 packaging/build_release.py
          --only hub
          --architecture ${{ matrix.architecture }}
          --output-dir dist
          ${{ startsWith(github.ref, 'refs/tags/')
              && format('--agent-package-url-base https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name)
              || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: hub_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  agent:
    name: agent .deb and .rpm (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      # The agent's packages carry an interpreter and compile the window's
      # bindings, so each is built in a container of its family — and for
      # arm64 that container runs under emulation on an x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build_release.py
          --only agent
          --architecture ${{ matrix.architecture }}
          --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: agent_packages_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # Not on a tag: a release is Linux until the installer has been walked on
  # real Windows, and this job has yet to run on a runner at all. A manual
  # run asks for it by name.
  agent_windows:
    name: agent installer (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # WiX is a dotnet tool rather than part of the image.
      - run: dotnet tool install --global wix

      - run: python agent/packaging/build_msi.py --output-dir dist --architecture x64

      # Built here too, and only built: nothing on an x86-64 runner can
      # install it.
      - run: python agent/packaging/build_msi.py --output-dir dist --architecture arm64

      # The installer is what ships, so it is run here rather than only
      # compiled: whether the service registers and starts, whether the
      # bundled interpreter finds the agent beside it, and whether
      # uninstalling cleans up.
      - name: Install it, use it, remove it
        shell: pwsh
        run: |
          # A native command exiting non-zero is a value to test here, not an
          # error to stop on: the agent reports an unenrolled machine that way.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $msi = (Get-ChildItem dist\*-windows-amd64.msi)[0].FullName
          Start-Process msiexec -Wait -ArgumentList '/i',$msi,'/quiet','/norestart'

          # A service that registers but cannot answer its manager reads as
          # start-pending and then dies, so the state is the assertion.
          $service = Get-CimInstance Win32_Service -Filter "Name='NeutrinoAgent'"
          $service | Format-List Name, State, StartMode, PathName
          if ($service.State -ne 'Running') {
            throw "the service is $($service.State)"
          }
          if ($service.PathName -notlike '*run --windows-service*') {
            throw "the service runs $($service.PathName)"
          }

          # Unenrolled, status says so and exits 1. Reaching that message
          # means the bundled interpreter imported the agent beside it.
          & "$env:ProgramFiles\Neutrino Agent\nagent.cmd" status
          if ($LASTEXITCODE -ne 1) {
            throw "nagent status exited $LASTEXITCODE, expected 1"
          }

          Start-Process msiexec -Wait -ArgumentList '/x',$msi,'/quiet','/norestart'

          if (Get-Service -Name 'NeutrinoAgent' -ErrorAction SilentlyContinue) {
            throw 'the service outlived the uninstaller'
          }

          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: agent_windows
          path: dist/*.msi
          if-no-files-found: error

  draft:
    name: checksums and draft release
    needs: [hub, agent, agent_windows]
    # The Windows job is skipped on a tag, and a skipped need must not
    # skip the release with it.
    if: >-
      always()
      && needs.hub.result == 'success'
      && needs.agent.result == 'success'
      && (needs.agent_windows.result == 'success' || needs.agent_windows.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS covers every package at once, so it is written here rather
      # than by the jobs that each produced one file.
      - run: python3 packaging/build_release.py --only checksums --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: release_dist
          path: dist/*

      - name: Open the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix is a pre-release, so the hub's update check
          # passes over it.
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --draft ${prerelease} \
            --title "${GITHUB_REF_NAME}" \
            --notes "" \
            dist/*
