name: release

# A tag builds everything and opens a draft; the notes are written by a person.
# workflow_dispatch builds the same packages and attaches them as artifacts
# without touching releases, which is how the pipeline is tried out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # After the agent: the hub seeds its cache with the agent packages of
  # both machines rather than building the agent again for its own, and
  # names the Windows and macOS installers in its manifest.
  hub:
    name: hub .deb, .rpm and Arch (${{ matrix.architecture }})
    needs: [agent, agent_windows, agent_macos]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      # The panel is gitignored, and hub/packaging/build_deb.py refuses to
      # package a hub without it. Vite writes straight into the package.
      - run: npm ci
        working-directory: hub/frontend

      - run: npm run build
        working-directory: hub/frontend

      # The hub is built inside debian:12, which for arm64 means running that
      # container under emulation on an x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      # A tag stamps the hub's agent manifest with where the release
      # publishes each package; a dispatch build carries no URL.
      - run: >
          python3 packaging/build_release.py
          --only hub
          --architecture ${{ matrix.architecture }}
          --output-dir dist
          --agent-packages agent_packages
          ${{ startsWith(github.ref, 'refs/tags/')
              && format('--agent-package-url-base https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name)
              || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: hub_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  agent:
    name: agent .deb and .rpm (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      # The agent's packages carry an interpreter and unpack the RustDesk
      # host for their machine, so each is built in a container of its
      # family — and for arm64 that container runs under emulation on an
      # x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build_release.py
          --only agent
          --architecture ${{ matrix.architecture }}
          --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: agent_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # x64 only: RustDesk publishes no Windows arm64 build to carry.
  agent_windows:
    name: agent installer (Windows x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # The interpreter the agent is compiled against; build_msi.py refuses
      # any other minor.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2

      - run: python agent/packaging/build_msi.py --output-dir dist --architecture x64

      # Installed and removed here: whether both services run, whether the
      # compiled agent answers, and whether removing it takes both away.
      - name: Install it, check its services, remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $log = "$env:RUNNER_TEMP\install.log"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i',$msi,'/quiet','/norestart','/l*v',$log
          Write-Host "msiexec /i exited $($p.ExitCode)"
          Select-String -Path $log -Pattern 'RustDesk|return value 3' | ForEach-Object { $_.Line } | Select-Object -Last 40
          Get-ChildItem "$env:ProgramFiles\Neutrino Agent" | Select-Object Name, Length | Format-Table -AutoSize
          Get-ChildItem "$env:ProgramFiles\RustDesk" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize
          $state = ''
          foreach ($i in 1..24) {
            $state = sc.exe query RustDesk | Select-String 'STATE'
            if ("$state" -match 'RUNNING') { break }
            Start-Sleep -Seconds 5
          }
          Write-Host "RustDesk after wait: $state"
          if ("$state" -notmatch 'RUNNING') {
            Write-Host 'Running the installer by hand for comparison'
            $exe = (Get-ChildItem "$env:ProgramFiles\Neutrino Agent" -Filter 'rustdesk*.exe')[0].FullName
            $q = Start-Process $exe -Wait -PassThru -ArgumentList '--silent-install'
            Write-Host "rustdesk --silent-install by hand exited $($q.ExitCode)"
            Start-Sleep -Seconds 20
            Get-ChildItem "$env:ProgramFiles\RustDesk" -ErrorAction SilentlyContinue | Select-Object Name | Format-Table -AutoSize
            Write-Host "RustDesk by hand: $(sc.exe query RustDesk | Select-String 'STATE')"
          }
          foreach ($service in 'neutrino_agent', 'RustDesk') {
            $state = sc.exe query $service | Select-String 'STATE'
            Write-Host "$service $state"
            if ("$state" -notmatch 'RUNNING') { throw "$service is not running" }
          }
          $nagent = "$env:ProgramFiles\Neutrino Agent\nagent.exe"
          $version = & $nagent --version
          if ($LASTEXITCODE -ne 0) { throw "nagent --version exited $LASTEXITCODE" }
          Write-Host "nagent $version"
          $log = "$env:RUNNER_TEMP\remove.log"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x',$msi,'/quiet','/norestart','/l*v',$log
          Write-Host "msiexec /x exited $($p.ExitCode)"
          Select-String -Path $log -Pattern 'UninstallRustDesk|return value 3' | ForEach-Object { $_.Line } | Select-Object -Last 12
          foreach ($service in 'neutrino_agent', 'RustDesk') {
            foreach ($i in 1..24) {
              sc.exe query $service | Out-Null
              if ($LASTEXITCODE -eq 1060) { break }
              Start-Sleep -Seconds 5
            }
            Write-Host "$service after removal: sc query exited $LASTEXITCODE"
            if ($LASTEXITCODE -ne 1060) { throw "$service outlived the uninstaller" }
          }
          if (Test-Path "$env:ProgramFiles\RustDesk") { Get-ChildItem "$env:ProgramFiles\RustDesk" | Select-Object Name | Format-Table -AutoSize }
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: agent_windows_amd64
          path: dist/*.msi
          if-no-files-found: error

  # Apple silicon, which is what GitHub's macOS runners are.
  agent_macos:
    name: agent installer (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 agent/packaging/build_pkg.py --output-dir dist --architecture arm64

      - name: Install it, check its job, remove it
        run: |
          set -e
          sudo installer -pkg dist/*.pkg -target /
          sudo launchctl print system/com.neutrino.agent | grep 'state = running'
          /usr/local/bin/nagent --version
          sudo launchctl bootout system/com.neutrino.agent
          sudo launchctl bootout system/com.carriez.RustDesk_service || true
          sudo rm -rf "/Library/Application Support/Neutrino/agent" \
            /Applications/RustDesk.app /usr/local/bin/nagent \
            /Library/LaunchDaemons/com.neutrino.agent.plist \
            /Library/LaunchDaemons/com.carriez.RustDesk_service.plist \
            /Library/LaunchAgents/com.carriez.RustDesk_server.plist
          sudo pkgutil --forget com.neutrino.agent
          if sudo launchctl print system/com.neutrino.agent; then
            echo "the agent's job outlived its removal"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: agent_macos_arm64
          path: dist/*.pkg
          if-no-files-found: error

  # The client is compiled, so each package is built on a machine of its own
  # architecture: Nuitka under emulation is hours, and the arm runners are
  # native.
  client:
    name: client .deb and .rpm (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - run: >
          python3 packaging/build_release.py
          --only client
          --architecture ${{ matrix.architecture }}
          --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: client_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # x64 only: cc-switch upstream publishes no Windows arm64 build, so there
  # is nothing to carry for that machine.
  client_windows:
    name: client installer (Windows x64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # The interpreter the client is compiled against; build_msi.py refuses
      # any other minor.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # WiX is a dotnet tool rather than part of the image, and the two
      # extensions the source loads are added beside it.
      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2
      - run: wix extension add -g WixToolset.UI.wixext/6.0.2

      # The stand-in for Npcap's Packet.dll, which easytier-core imports and
      # the installer carries beside it; MSVC from the image's Visual Studio.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the stand-in packet.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/packet_stub | Out-Null
          cl /nologo /O2 /LD client/desktop/packaging/packet_stub.c /Fe:build/packet_stub/packet.dll /Fo:build/packet_stub/
          if ($LASTEXITCODE -ne 0) { throw "cl exited $LASTEXITCODE" }

      - run: python client/desktop/packaging/build_msi.py --output-dir dist --architecture x64 --packet-dll build/packet_stub/packet.dll

      # The installer is what ships, so it is run here rather than only
      # compiled: whether the compiled client answers, whether the entry
      # lands on PATH, and whether uninstalling takes the prefix whole.
      - name: Install it, use it, remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $msi = (Get-ChildItem dist\*.msi)[0].FullName
          $log = "$env:RUNNER_TEMP\client_install.log"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i',$msi,'/quiet','/norestart','/l*v',$log
          Write-Host "msiexec /i exited $($p.ExitCode)"
          $nclient = "$env:ProgramFiles\Neutrino Client\nclient.exe"
          if ($p.ExitCode -ne 0 -or -not (Test-Path $nclient)) {
            Select-String -Path $log -Pattern 'return value 3|Error 19|NeutrinoClientEasytier' | ForEach-Object { $_.Line } | Select-Object -Last 25
            Get-WinEvent -LogName System -MaxEvents 200 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'Neutrino' } | Select-Object -First 6 | ForEach-Object { "event $($_.Id): $($_.Message)" }
            Get-WinEvent -LogName Application -MaxEvents 200 -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'nclient' } | Select-Object -First 4 | ForEach-Object { "app event $($_.Id): $($_.Message)" }
            throw "the client did not install"
          }
          $version = & $nclient --version
          if ($LASTEXITCODE -ne 0) { throw "nclient --version exited $LASTEXITCODE" }
          Write-Host "nclient $version"
          # Unbound, status says so and exits 1.
          & $nclient status
          if ($LASTEXITCODE -ne 1) { throw "nclient status exited $LASTEXITCODE, expected 1" }
          $path = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          if ($path -notlike '*Neutrino Client*') { throw 'the install is not on PATH' }
          if (-not (Test-Path "$env:ProgramFiles\Neutrino Client\bin\packet.dll")) { throw 'no packet.dll beside easytier-core.exe' }
          # The EasyTier daemon runs as a service and answers on its pipe.
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Service NeutrinoClientEasytier).Status -ne 'Running' -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if ((Get-Service NeutrinoClientEasytier).Status -ne 'Running') { throw 'the EasyTier daemon is not running' }
          if (-not (Test-Path '\\.\pipe\neutrino_client_easytier')) { throw 'the EasyTier daemon has no pipe' }
          Start-Process msiexec -Wait -ArgumentList '/x',$msi,'/quiet','/norestart'
          if (Test-Path "$env:ProgramFiles\Neutrino Client") { throw 'the prefix outlived the uninstaller' }
          if (Get-Service NeutrinoClientEasytier -ErrorAction SilentlyContinue) { throw 'the EasyTier daemon outlived the uninstaller' }
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client_windows_x64
          path: dist/*.msi
          if-no-files-found: error

  # Apple silicon, which is what GitHub's macOS runners are.
  client_macos:
    name: client installer (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 client/desktop/packaging/build_pkg.py --output-dir dist --architecture arm64

      - name: Install it, use it
        run: |
          set -e
          sudo installer -pkg dist/*.pkg -target /
          /usr/local/bin/nclient --version
          # Unbound, status says so and exits 1.
          if /usr/local/bin/nclient status; then echo "expected exit 1"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: client_macos_arm64
          path: dist/*.pkg
          if-no-files-found: error

  # One source archive: this tree at the commit, with the source of what the
  # packages carry under copyleft beside it, at the tags the binaries were
  # built from.
  sources:
    name: source archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: python3 packaging/build_release.py --only sources --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sources
          path: dist/*-source.tar.gz
          if-no-files-found: error

  draft:
    name: checksums and draft release
    needs: [hub, agent, client, client_windows, client_macos, sources]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS covers every package at once, so it is written here rather
      # than by the jobs that each produced one file.
      - run: python3 packaging/build_release.py --only checksums --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: release_dist
          path: dist/*

      - name: Open the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix is a pre-release, so the hub's update check
          # passes over it.
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --draft ${prerelease} \
            --title "${GITHUB_REF_NAME}" \
            --notes "" \
            dist/*
