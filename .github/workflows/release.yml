name: release

# A tag builds every platform in both editions and opens one draft holding
# both, with the install scripts, the cc-switch files, latest.json and one
# SHA256SUMS; the notes are written by a person. workflow_dispatch builds the
# same files and attaches them as the artifact release_dist without touching
# releases, which is how the pipeline is tried out; its editions input cuts a
# trial to one edition.
#
# Each job sets up its host, then runs one script under packaging/build and
# checks what it built with packaging/ci/check.py; both run the same way on a
# workstation of the same kind. A cn job does the same inside the unpacked
# mainland tree, with --edition cn.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      editions:
        description: "the editions to build"
        type: choice
        options: [both, intl, cn]
        default: both

permissions:
  contents: write

# A tag's hub packages hold the release sites, from which a hub fetches the
# agent packages it does not carry; a dispatch build's hold none.
env:
  RELEASE_SITES: ${{ startsWith(github.ref, 'refs/tags/') && '--release-sites' || '' }}

jobs:
  # The two Go programs of every target, built once: neutrino_transport from
  # transport/ and neutrino_ssh_server from agent/sshserver/, static, with
  # the version stamped. Every package job of a target downloads its
  # go_<target> artifact into dist/go/<target>/ and carries the same files.
  go_programs:
    name: Go programs (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, windows-amd64, darwin-arm64, darwin-amd64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            transport/go.sum
            agent/sshserver/go.sum

      - run: python3 packaging/build/build_transport.py --target ${{ matrix.target }} --output-dir dist

      - if: hashFiles('agent/sshserver/go.mod') != ''
        run: python3 packaging/build/build_ssh_server.py --target ${{ matrix.target }} --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: go_${{ matrix.target }}
          path: dist/go/${{ matrix.target }}/*
          if-no-files-found: error

  # After every agent: the hub package carries the agent package of its own
  # family and machine, and its manifest names every agent package of the
  # release with its hash, so the build reads them all.
  hub:
    name: hub .deb, .rpm and Arch (${{ matrix.architecture }})
    if: inputs.editions != 'cn'
    needs: [go_programs, agent, agent_windows, agent_macos]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_linux-${{ matrix.architecture }}
          path: dist/go/linux-${{ matrix.architecture }}

      - uses: actions/download-artifact@v8
        with:
          pattern: agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      # The panel is gitignored, and build_hub.py refuses to package a hub
      # without it. Vite writes straight into the package.
      - run: npm ci
        working-directory: hub/frontend

      - run: npm run build
        working-directory: hub/frontend

      # The hub is built inside its family's container, which for arm64
      # means running that container under emulation on an x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build/build_hub.py
          --architecture ${{ matrix.architecture }}
          --output-dir dist
          --agent-packages agent_packages
          ${{ env.RELEASE_SITES }}

      - run: >
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
          [ -e "$package" ] || continue;
          python3 packaging/ci/check.py linux "$package";
          done

      - uses: actions/upload-artifact@v7
        with:
          name: hub_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  agent:
    name: agent .deb and .rpm (${{ matrix.architecture }})
    if: inputs.editions != 'cn'
    needs: [go_programs]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_linux-${{ matrix.architecture }}
          path: dist/go/linux-${{ matrix.architecture }}

      # Each package is built in a container of its family, and for arm64
      # that container runs under emulation on an x86-64 runner.
      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build/build_agent.py
          --architecture ${{ matrix.architecture }}
          --output-dir dist

      - run: >
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
          [ -e "$package" ] || continue;
          python3 packaging/ci/check.py linux "$package";
          done

      - uses: actions/upload-artifact@v7
        with:
          name: agent_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # x64 only: RustDesk publishes no Windows arm64 build to carry.
  agent_windows:
    name: agent installer (Windows x64)
    if: inputs.editions != 'cn'
    needs: [go_programs]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_windows-amd64
          path: dist/go/windows-amd64

      # The interpreter the agent is compiled against; the build refuses any
      # other minor.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2

      # The Brotli decompressor RustDesk's packed Windows files need.
      - run: python -m pip install brotli==1.2.0

      - run: python packaging/build/build_agent_windows.py --output-dir dist --architecture x64

      # Uploaded before the check, so a package that fails it can still be
      # downloaded; a job that needs it waits on this job's result.
      - uses: actions/upload-artifact@v7
        with:
          name: agent_windows_amd64
          path: dist/*.msi
          if-no-files-found: error

      - run: python packaging/ci/check.py agent_windows dist/*.msi
        shell: bash

  # Both Macs: Apple silicon on macos-15, Intel on macos-15-intel. The build
  # is native, so each package comes off a runner of its own machine.
  agent_macos:
    name: agent installer (macOS ${{ matrix.arch }})
    if: inputs.editions != 'cn'
    needs: [go_programs]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_darwin-${{ matrix.arch }}
          path: dist/go/darwin-${{ matrix.arch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 packaging/build/build_agent_macos.py --output-dir dist --architecture ${{ matrix.arch }}

      - run: python3 packaging/ci/check.py agent_macos dist/*.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: agent_macos_${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error

  # The hub of each Mac, after every agent: it carries the agent's .pkg of its
  # own machine and names every agent package in its manifest.
  hub_macos:
    name: hub installer (macOS ${{ matrix.arch }})
    if: inputs.editions != 'cn'
    needs: [go_programs, agent, agent_windows, agent_macos]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_darwin-${{ matrix.arch }}
          path: dist/go/darwin-${{ matrix.arch }}

      - uses: actions/download-artifact@v8
        with:
          pattern: agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      - run: npm ci
        working-directory: hub/frontend

      - run: npm run build
        working-directory: hub/frontend

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: >
          python3 packaging/build/build_hub_macos.py
          --output-dir dist
          --architecture ${{ matrix.arch }}
          --agent-packages agent_packages
          ${{ env.RELEASE_SITES }}

      - run: python3 packaging/ci/check.py hub_macos dist/*.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: hub_macos_${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error

  # x64 only, as the agent it carries is.
  hub_windows:
    name: hub installer (Windows x64)
    if: inputs.editions != 'cn'
    needs: [go_programs, agent, agent_windows, agent_macos]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_windows-amd64
          path: dist/go/windows-amd64

      - uses: actions/download-artifact@v8
        with:
          pattern: agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      - run: npm ci
        working-directory: hub/frontend

      - run: npm run build
        working-directory: hub/frontend

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2

      # The stand-in for Npcap's Packet.dll beside easytier-core, as the
      # client's job builds it.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the stand-in packet.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/packet_stub | Out-Null
          cl /nologo /O2 /LD client/desktop/packaging/packet_stub.c /Fe:build/packet_stub/packet.dll /Fo:build/packet_stub/
          if ($LASTEXITCODE -ne 0) { throw "cl exited $LASTEXITCODE" }

      - run: >
          python packaging/build/build_hub_windows.py
          --output-dir dist
          --architecture x64
          --agent-packages agent_packages
          --packet-dll build/packet_stub/packet.dll
          ${{ env.RELEASE_SITES }}

      # Uploaded before the check, so a package that fails it can still be
      # downloaded; a job that needs it waits on this job's result.
      - uses: actions/upload-artifact@v7
        with:
          name: hub_windows_amd64
          path: dist/*.msi
          if-no-files-found: error

      - run: python packaging/ci/check.py hub_windows dist/*.msi
        shell: bash

  # The client is compiled, so each package is built on a machine of its own
  # architecture: Nuitka under emulation is hours, and the arm runners are
  # native.
  client:
    name: client .deb and .rpm (${{ matrix.architecture }})
    if: inputs.editions != 'cn'
    needs: [go_programs]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_linux-${{ matrix.architecture }}
          path: dist/go/linux-${{ matrix.architecture }}

      - run: >
          python3 packaging/build/build_client_desktop.py
          --architecture ${{ matrix.architecture }}
          --output-dir dist

      - run: >
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
          [ -e "$package" ] || continue;
          python3 packaging/ci/check.py linux "$package";
          done

      - uses: actions/upload-artifact@v7
        with:
          name: client_${{ matrix.architecture }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # x64 only: cc-switch upstream publishes no Windows arm64 build, so there
  # is nothing to carry for that machine.
  client_windows:
    name: client installer (Windows x64)
    if: inputs.editions != 'cn'
    needs: [go_programs]
    runs-on: windows-2025
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_windows-amd64
          path: dist/go/windows-amd64

      # The interpreter the client is compiled against; the build refuses any
      # other minor.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # WiX is a dotnet tool rather than part of the image, and the two
      # extensions the source loads are added beside it.
      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2
      - run: wix extension add -g WixToolset.UI.wixext/6.0.2

      # The stand-in for Npcap's Packet.dll, which easytier-core imports and
      # the installer carries beside it; MSVC from the image's Visual Studio.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the stand-in packet.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/packet_stub | Out-Null
          cl /nologo /O2 /LD client/desktop/packaging/packet_stub.c /Fe:build/packet_stub/packet.dll /Fo:build/packet_stub/
          if ($LASTEXITCODE -ne 0) { throw "cl exited $LASTEXITCODE" }

      - run: python packaging/build/build_client_windows.py --output-dir dist --architecture x64 --packet-dll build/packet_stub/packet.dll

      # Uploaded before any check, so a package that fails its check can
      # still be downloaded; the draft waits on this job's result.
      - uses: actions/upload-artifact@v7
        with:
          name: client_windows_x64
          path: dist/*.msi
          if-no-files-found: error

      # One step per phase, so the step list says which phase a lost
      # runner died in; after each, what the phase wrote so far: its
      # progress, its msiexec log and a snapshot of the machine. Each
      # phase also posts its progress as a commit status.
      - name: "Check: install over the released 0.4.0"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase upgrade --evidence-dir ci_evidence
        shell: bash
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_client_windows_x64_upgrade
          path: ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: install"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase install --evidence-dir ci_evidence
        shell: bash
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_client_windows_x64_install
          path: ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: what the install left"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase installed --evidence-dir ci_evidence
        shell: bash
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_client_windows_x64_installed
          path: ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: plant the relaunch task and run the repair"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase repair --evidence-dir ci_evidence
        shell: bash
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_client_windows_x64_repair
          path: ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: wait for the relaunch task"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase marker --evidence-dir ci_evidence
        shell: bash
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_client_windows_x64_marker
          path: ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: removal"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase remove --evidence-dir ci_evidence
        shell: bash
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_client_windows_x64_remove
          path: ci_evidence/*
          if-no-files-found: ignore

  # Both Macs, as the agent's job builds them.
  client_macos:
    name: client installer (macOS ${{ matrix.arch }})
    if: inputs.editions != 'cn'
    needs: [go_programs]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: go_darwin-${{ matrix.arch }}
          path: dist/go/darwin-${{ matrix.arch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 packaging/build/build_client_macos.py --output-dir dist --architecture ${{ matrix.arch }}

      - run: python3 packaging/ci/check.py client_macos dist/*.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: client_macos_${{ matrix.arch }}
          path: dist/*.pkg
          if-no-files-found: error

  # The Android app: the release build on a tag, signed with the project's
  # key and checked against its certificate; the debug build otherwise. The
  # arm64-v8a apk is the one published; the x86_64 apk of the same build is
  # installed and launched once in an emulator.
  client_android:
    name: client .apk (Android)
    if: inputs.editions != 'cn'
    runs-on: ubuntu-24.04
    env:
      # The release certificate's SHA-256, as apksigner prints it.
      ANDROID_RELEASE_CERT_SHA256: 0e20b8b4542f329c4d3ed91632f3ea90730cb99472c46c31585780d046ee612d  # scan: allow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # The NetBird, EasyTier and RustDesk libraries the app carries, kept under the
      # name the cores cache gives them: the core, its pinned commit, the ABI.
      - name: Name the cores
        id: cores_key
        run: echo "key=$(python3 packaging/build/build_client_android.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the phone cores
        id: cores
        uses: actions/cache@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.cores_key.outputs.key }}

      # The JNI side of the RustDesk core is compiled with the app.
      - name: Install the NDK and CMake the app builds with
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: actions/setup-go@v7
        if: steps.cores.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.3"

      - name: Install what building the cores needs
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260816165457-f98cc9b3c733
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260816165457-f98cc9b3c733
          export PATH="$(go env GOPATH)/bin:${PATH}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
          cargo install cargo-ndk --locked
          sudo apt-get install -y nasm

      - name: Build the apk
        env:
          ANDROID_KEYSTORE_B64: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEY_ALIAS || '' }}
        run: >
          python3 packaging/build/build_client_android.py
          --variant ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 'release' || 'debug' }}
          --output-dir dist

      - name: Check the release signature
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        run: |
          apksigner="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          digest="$("${apksigner}" verify --print-certs dist/*-android.apk \
            | sed -n -E 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' | head -1)"
          echo "signed by ${digest}"
          test "${digest}" = "${ANDROID_RELEASE_CERT_SHA256}"

      - name: Allow the emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch once in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 packaging/ci/check.py client_android dist/neutrino-client-*-android-x86_64.apk

      - uses: actions/upload-artifact@v7
        with:
          name: client_android
          path: dist/*-android.apk
          if-no-files-found: error

  # The iOS app, unsigned: each person signs their own copy.
  client_ios:
    name: client .ipa (iOS)
    if: inputs.editions != 'cn'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The RustDesk core the app links, kept under the name the cores cache
      # gives it: the core, its pinned commit, the machine, the recipe.
      - name: Name the core
        id: core_key
        run: echo "key=$(python3 packaging/build/build_client_ios.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the core
        id: core
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.core_key.outputs.key }}

      - name: Install what building the core needs
        if: steps.core.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Put the core into the app
        run: python3 packaging/build/build_core_rustdesk_ios.py

      # The transport's framework, the second core the cache key names.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Put the transport into the app
        run: python3 packaging/build/build_core_transport.py

      - name: Save the cores
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.core_key.outputs.key }}

      - run: brew install xcodegen

      - run: python3 packaging/build/build_client_ios.py --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: client_ios
          path: dist/*-ios.ipa
          if-no-files-found: error

  # One source archive: this tree at the commit, with the source of what the
  # packages carry under copyleft beside it, at the tags the binaries were
  # built from; and install.sh and install.ps1, stamped with the release
  # sites.
  sources:
    name: source archive and install scripts
    if: inputs.editions != 'cn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: python3 packaging/build/build_sources.py --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: sources
          path: dist/*
          if-no-files-found: error

  # One draft holding both editions: every file the build jobs made, the
  # four install scripts, the cc-switch files at their pin, latest.json and
  # SHA256SUMS over all of it. A dispatch run that built one edition holds
  # that edition alone.
  draft:
    name: checksums and draft release
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs:
      [
        hub,
        hub_macos,
        hub_windows,
        agent,
        agent_windows,
        agent_macos,
        client,
        client_windows,
        client_macos,
        client_android,
        client_ios,
        sources,
        sources_cn,
        hub_cn,
        hub_macos_cn,
        hub_windows_cn,
        agent_cn,
        agent_windows_cn,
        agent_macos_cn,
        client_cn,
        client_windows_cn,
        client_macos_cn,
        client_android_cn,
        client_ios_cn,
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the files of both editions
        run: |
          mkdir dist
          for artifact in artifacts/*/; do
            case "$(basename "$artifact")" in
              # A check's evidence is no release file.
              check_*) continue ;;
            esac
            for file in "$artifact"*; do
              if [ -e "dist/$(basename "$file")" ]; then
                echo "two artifacts hold $(basename "$file")" >&2
                exit 1
              fi
              cp "$file" dist/
            done
          done

      # The pinned cc-switch files and their licence, which the hubs fetch
      # from the release sites.
      - run: python3 packaging/build/build_cc_switch.py --output-dir dist

      # latest.json and SHA256SUMS over every file at once, so they are
      # written here rather than by the jobs that each produced one file.
      - run: python3 packaging/build/build_checksums.py --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: release_dist
          path: dist/*

      - name: Open the draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix is a pre-release, so the hub's update check
          # passes over it.
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --draft ${prerelease} \
            --title "${GITHUB_REF_NAME}" \
            --notes "" \
            dist/*

  # The mainland source tree: this tree without what cn leaves out, stamped
  # cn, with the source of what the cn packages carry; and install-cn.sh and
  # install-cn.ps1. Every cn job below unpacks the tree and builds inside it.
  sources_cn:
    name: mainland source tree and install scripts
    if: inputs.editions != 'intl'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: python3 packaging/build/build_sources.py --edition cn --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: cn_sources
          path: dist/*
          if-no-files-found: error

  agent_cn:
    name: cn agent .deb and .rpm (${{ matrix.architecture }})
    needs: [go_programs, sources_cn]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_linux-${{ matrix.architecture }}
          path: cn/dist/go/linux-${{ matrix.architecture }}

      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build/build_agent.py
          --edition cn
          --architecture ${{ matrix.architecture }}
          --output-dir dist
        working-directory: cn

      - run: >
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
          [ -e "$package" ] || continue;
          python3 packaging/ci/check.py linux "$package";
          done
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_agent_${{ matrix.architecture }}
          path: |
            cn/dist/*.deb
            cn/dist/*.rpm
          if-no-files-found: error

  agent_windows_cn:
    name: cn agent installer (Windows x64)
    needs: [go_programs, sources_cn]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        shell: bash
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_windows-amd64
          path: cn/dist/go/windows-amd64

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2

      # The Brotli decompressor RustDesk's packed Windows files need.
      - run: python -m pip install brotli==1.2.0

      - run: python packaging/build/build_agent_windows.py --edition cn --output-dir dist --architecture x64
        working-directory: cn

      # Uploaded before the check, so a package that fails it can still be
      # downloaded; a job that needs it waits on this job's result.
      - uses: actions/upload-artifact@v7
        with:
          name: cn_agent_windows_amd64
          path: cn/dist/*.msi
          if-no-files-found: error

      - run: python packaging/ci/check.py agent_windows dist/*.msi
        shell: bash
        working-directory: cn

  # Both Macs, as the intl job builds them.
  agent_macos_cn:
    name: cn agent installer (macOS ${{ matrix.arch }})
    needs: [go_programs, sources_cn]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_darwin-${{ matrix.arch }}
          path: cn/dist/go/darwin-${{ matrix.arch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 packaging/build/build_agent_macos.py --edition cn --output-dir dist --architecture ${{ matrix.arch }}
        working-directory: cn

      - run: python3 packaging/ci/check.py agent_macos dist/*.pkg
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_agent_macos_${{ matrix.arch }}
          path: cn/dist/*.pkg
          if-no-files-found: error

  hub_cn:
    name: cn hub .deb, .rpm and Arch (${{ matrix.architecture }})
    needs: [go_programs, agent_cn, agent_windows_cn, agent_macos_cn]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_linux-${{ matrix.architecture }}
          path: cn/dist/go/linux-${{ matrix.architecture }}

      - uses: actions/download-artifact@v8
        with:
          pattern: cn_agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cn/hub/frontend/package-lock.json

      - run: npm ci
        working-directory: cn/hub/frontend

      - run: npm run build
        working-directory: cn/hub/frontend

      - uses: docker/setup-qemu-action@v4
        if: matrix.architecture != 'amd64'

      - run: >
          python3 packaging/build/build_hub.py
          --edition cn
          --architecture ${{ matrix.architecture }}
          --output-dir dist
          --agent-packages ../agent_packages
          ${{ env.RELEASE_SITES }}
        working-directory: cn

      - run: >
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
          [ -e "$package" ] || continue;
          python3 packaging/ci/check.py linux "$package";
          done
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_hub_${{ matrix.architecture }}
          path: |
            cn/dist/*.deb
            cn/dist/*.rpm
            cn/dist/*.pkg.tar.zst
          if-no-files-found: error

  # Both Macs, as the intl job builds them.
  hub_macos_cn:
    name: cn hub installer (macOS ${{ matrix.arch }})
    needs: [go_programs, agent_cn, agent_windows_cn, agent_macos_cn]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_darwin-${{ matrix.arch }}
          path: cn/dist/go/darwin-${{ matrix.arch }}

      - uses: actions/download-artifact@v8
        with:
          pattern: cn_agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cn/hub/frontend/package-lock.json

      - run: npm ci
        working-directory: cn/hub/frontend

      - run: npm run build
        working-directory: cn/hub/frontend

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: >
          python3 packaging/build/build_hub_macos.py
          --edition cn
          --output-dir dist
          --architecture ${{ matrix.arch }}
          --agent-packages ../agent_packages
          ${{ env.RELEASE_SITES }}
        working-directory: cn

      - run: python3 packaging/ci/check.py hub_macos dist/*.pkg
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_hub_macos_${{ matrix.arch }}
          path: cn/dist/*.pkg
          if-no-files-found: error

  hub_windows_cn:
    name: cn hub installer (Windows x64)
    needs: [go_programs, agent_cn, agent_windows_cn, agent_macos_cn]
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        shell: bash
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_windows-amd64
          path: cn/dist/go/windows-amd64

      - uses: actions/download-artifact@v8
        with:
          pattern: cn_agent_*
          path: agent_packages
          merge-multiple: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cn/hub/frontend/package-lock.json

      - run: npm ci
        working-directory: cn/hub/frontend

      - run: npm run build
        working-directory: cn/hub/frontend

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the stand-in packet.dll
        shell: pwsh
        working-directory: cn
        run: |
          New-Item -ItemType Directory -Force build/packet_stub | Out-Null
          cl /nologo /O2 /LD client/desktop/packaging/packet_stub.c /Fe:build/packet_stub/packet.dll /Fo:build/packet_stub/
          if ($LASTEXITCODE -ne 0) { throw "cl exited $LASTEXITCODE" }

      - run: >
          python packaging/build/build_hub_windows.py
          --edition cn
          --output-dir dist
          --architecture x64
          --agent-packages ../agent_packages
          --packet-dll build/packet_stub/packet.dll
          ${{ env.RELEASE_SITES }}
        working-directory: cn

      # Uploaded before the check, so a package that fails it can still be
      # downloaded; a job that needs it waits on this job's result.
      - uses: actions/upload-artifact@v7
        with:
          name: cn_hub_windows_amd64
          path: cn/dist/*.msi
          if-no-files-found: error

      - run: python packaging/ci/check.py hub_windows dist/*.msi
        shell: bash
        working-directory: cn

  client_cn:
    name: cn client .deb and .rpm (${{ matrix.architecture }})
    needs: [go_programs, sources_cn]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_linux-${{ matrix.architecture }}
          path: cn/dist/go/linux-${{ matrix.architecture }}

      - run: >
          python3 packaging/build/build_client_desktop.py
          --edition cn
          --architecture ${{ matrix.architecture }}
          --output-dir dist
        working-directory: cn

      - run: >
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
          [ -e "$package" ] || continue;
          python3 packaging/ci/check.py linux "$package";
          done
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_client_${{ matrix.architecture }}
          path: |
            cn/dist/*.deb
            cn/dist/*.rpm
          if-no-files-found: error

  client_windows_cn:
    name: cn client installer (Windows x64)
    needs: [go_programs, sources_cn]
    runs-on: windows-2025
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        shell: bash
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_windows-amd64
          path: cn/dist/go/windows-amd64

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: dotnet tool install --global wix --version 6.0.2
      - run: wix extension add -g WixToolset.Util.wixext/6.0.2
      - run: wix extension add -g WixToolset.UI.wixext/6.0.2

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the stand-in packet.dll
        shell: pwsh
        working-directory: cn
        run: |
          New-Item -ItemType Directory -Force build/packet_stub | Out-Null
          cl /nologo /O2 /LD client/desktop/packaging/packet_stub.c /Fe:build/packet_stub/packet.dll /Fo:build/packet_stub/
          if ($LASTEXITCODE -ne 0) { throw "cl exited $LASTEXITCODE" }

      - run: python packaging/build/build_client_windows.py --edition cn --output-dir dist --architecture x64 --packet-dll build/packet_stub/packet.dll
        working-directory: cn

      # Uploaded before any check, so a package that fails its check can
      # still be downloaded; the draft waits on this job's result.
      - uses: actions/upload-artifact@v7
        with:
          name: cn_client_windows_amd64
          path: cn/dist/*.msi
          if-no-files-found: error

      # One step per phase, so the step list says which phase a lost
      # runner died in; after each, what the phase wrote so far: its
      # progress, its msiexec log and a snapshot of the machine. Each
      # phase also posts its progress as a commit status.
      - name: "Check: install over the released 0.4.0"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase upgrade --evidence-dir ci_evidence
        shell: bash
        working-directory: cn
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_cn_client_windows_amd64_upgrade
          path: cn/ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: install"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase install --evidence-dir ci_evidence
        shell: bash
        working-directory: cn
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_cn_client_windows_amd64_install
          path: cn/ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: what the install left"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase installed --evidence-dir ci_evidence
        shell: bash
        working-directory: cn
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_cn_client_windows_amd64_installed
          path: cn/ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: plant the relaunch task and run the repair"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase repair --evidence-dir ci_evidence
        shell: bash
        working-directory: cn
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_cn_client_windows_amd64_repair
          path: cn/ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: wait for the relaunch task"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase marker --evidence-dir ci_evidence
        shell: bash
        working-directory: cn
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_cn_client_windows_amd64_marker
          path: cn/ci_evidence/*
          if-no-files-found: ignore

      - name: "Check: removal"
        run: python packaging/ci/check.py client_windows dist/*.msi --phase remove --evidence-dir ci_evidence
        shell: bash
        working-directory: cn
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: check_cn_client_windows_amd64_remove
          path: cn/ci_evidence/*
          if-no-files-found: ignore

  # Both Macs, as the intl job builds them.
  client_macos_cn:
    name: cn client installer (macOS ${{ matrix.arch }})
    needs: [go_programs, sources_cn]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            arch: arm64
          - runs-on: macos-15-intel
            arch: amd64
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/download-artifact@v8
        with:
          name: go_darwin-${{ matrix.arch }}
          path: cn/dist/go/darwin-${{ matrix.arch }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 packaging/build/build_client_macos.py --edition cn --output-dir dist --architecture ${{ matrix.arch }}
        working-directory: cn

      - run: python3 packaging/ci/check.py client_macos dist/*.pkg
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_client_macos_${{ matrix.arch }}
          path: cn/dist/*.pkg
          if-no-files-found: error

  # The cn apk, with the same cores, signed and checked as the intl one is.
  client_android_cn:
    name: cn client .apk (Android)
    needs: [sources_cn]
    runs-on: ubuntu-24.04
    env:
      ANDROID_RELEASE_CERT_SHA256: 0e20b8b4542f329c4d3ed91632f3ea90730cb99472c46c31585780d046ee612d  # scan: allow
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Name the cores
        id: cores_key
        working-directory: cn
        run: echo "key=$(python3 packaging/build/build_client_android.py --edition cn --cache-key)" >> "$GITHUB_OUTPUT"

      # The cores are the same in both editions, so the key is the intl one's.
      - name: Cache the phone cores
        id: cores
        uses: actions/cache@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.cores_key.outputs.key }}

      - name: Install the NDK and CMake the app builds with
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: actions/setup-go@v7
        if: steps.cores.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.3"

      - name: Install what building the cores needs
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260816165457-f98cc9b3c733
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260816165457-f98cc9b3c733
          export PATH="$(go env GOPATH)/bin:${PATH}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
          cargo install cargo-ndk --locked
          sudo apt-get install -y nasm

      - name: Build the apk
        working-directory: cn
        env:
          ANDROID_KEYSTORE_B64: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEYSTORE_B64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEY_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && secrets.ANDROID_KEY_ALIAS || '' }}
        run: >
          python3 packaging/build/build_client_android.py
          --edition cn
          --variant ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && 'release' || 'debug' }}
          --output-dir dist

      - name: Check the release signature
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        working-directory: cn
        run: |
          apksigner="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          digest="$("${apksigner}" verify --print-certs dist/*-android-cn.apk \
            | sed -n -E 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' | head -1)"
          echo "signed by ${digest}"
          test "${digest}" = "${ANDROID_RELEASE_CERT_SHA256}"

      - name: Allow the emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch once in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: cn
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: python3 packaging/ci/check.py client_android dist/neutrino-client-*-android-x86_64-cn.apk

      - uses: actions/upload-artifact@v7
        with:
          name: cn_client_android
          path: cn/dist/*-android-cn.apk
          if-no-files-found: error

  # The cn .ipa, built in the mainland tree as the intl one is.
  client_ios_cn:
    name: cn client .ipa (iOS)
    needs: [sources_cn]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - name: Name the core
        id: core_key
        working-directory: cn
        run: echo "key=$(python3 packaging/build/build_client_ios.py --edition cn --cache-key)" >> "$GITHUB_OUTPUT"

      # The core is the same in both editions, so the key is the intl one's.
      - name: Restore the core
        id: core
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.core_key.outputs.key }}

      - name: Install what building the core needs
        if: steps.core.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Put the core into the app
        working-directory: cn
        run: python3 packaging/build/build_core_rustdesk_ios.py

      # The transport's framework, the second core the cache key names.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"

      - name: Put the transport into the app
        working-directory: cn
        run: python3 packaging/build/build_core_transport.py

      - name: Save the cores
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.core_key.outputs.key }}

      - run: brew install xcodegen

      - run: python3 packaging/build/build_client_ios.py --edition cn --output-dir dist
        working-directory: cn

      - uses: actions/upload-artifact@v7
        with:
          name: cn_client_ios
          path: cn/dist/*-ios-cn.ipa
          if-no-files-found: error
