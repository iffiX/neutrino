name: publish

# Turns the draft the release workflow opened for a tag into the published
# release, with the notes a person wrote, then publishes the same release to
# CNB, the second release site. The share_page job then deploys the share page,
# built from the tag, to Cloudflare Pages. A tag with a suffix is a
# pre-release, published on GitHub alone with no share page deployed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag whose draft to publish"
        required: true
        type: string
      notes:
        description: "the release notes, Markdown"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: publish the draft on GitHub and on CNB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Write the notes
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq '"draft="+(.isDraft|tostring)+" "+.url'

      # The files come from the release workflow's run for the tag, the
      # artifact release_dist.
      - name: Publish the release to CNB
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 packaging/ci/publish_cn.py --tag "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  share_page:
    name: deploy the share page from the tag
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # wrangler 4.150.0 needs Node 22 or newer.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # main is the Pages project's production branch.
      - name: Deploy the share page to Cloudflare Pages
        env:
          TAG: ${{ inputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$TAG" in
            *-*)
              echo "$TAG is a pre-release; no share page is deployed"
              exit 0
              ;;
          esac
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; no share page is deployed"
              exit 0
            fi
          done
          python3 packaging/build/build_share_page.py --output-dir dist/share_page
          npx --yes wrangler@4.150.0 pages deploy dist/share_page \
            --project-name neutrinohub-share --branch main
          # TODO: EdgeOne Pages copy for mainland China
