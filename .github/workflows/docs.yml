name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "images/icons/**"
      - "images/web/**"
      - "packaging/build/build_docs.py"
      - "packaging/ci/count_tests.py"
      - ".github/workflows/docs.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # The READMEs' tests badge reads badges/tests.json from the site.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hub/pyproject.toml
      - name: Install the packages whose tests are counted
        working-directory: ${{ github.workspace }}
        run: pip install -e "hub[dev]" -e agent -e client/desktop
      - name: Count the tests
        working-directory: ${{ github.workspace }}
        run: python packaging/ci/count_tests.py . docs/public/badges/tests.json
      - name: Check and build website
        run: python3 ../packaging/build/build_docs.py --install
      # main is the Pages project's production branch.
      - name: Deploy the website to Cloudflare Pages
        if: >-
          github.event_name != 'pull_request'
          && (startsWith(github.ref, 'refs/tags/v')
              || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
          && vars.DOCS_PAGES_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.150.0 pages deploy .vitepress/dist
          --project-name neutrinohub --branch main
