name: docs

on:
  pull_request:
    paths:
      - "docs/guide/**"
      - "images/guide/**"
      - "images/icons/**"
      - "images/web/**"
      - "packaging/screenshots/**"
      - "packaging/build/build_docs.py"
      - ".github/workflows/docs.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/guide
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: docs/guide/.nvmrc
          cache: npm
          cache-dependency-path: docs/guide/package-lock.json
      - name: Read Pages configuration
        id: pages
        if: >-
          github.event_name != 'pull_request'
          && startsWith(github.ref, 'refs/tags/v')
          && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
      # A pull request also builds for the repository's own subpath, the
      # one the site is served under on GitHub Pages without a domain.
      - name: Check and build website
        run: >
          python3 ../../packaging/build/build_docs.py --install
          ${{ github.event_name == 'pull_request' && '--base /neutrino/' || '' }}
          --base '${{ steps.pages.outputs.base_path || '/' }}'
      - name: Upload website
        if: >-
          github.event_name != 'pull_request'
          && startsWith(github.ref, 'refs/tags/v')
          && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/guide/.vitepress/dist

  deploy:
    if: >-
      github.event_name != 'pull_request'
      && (startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && vars.DOCS_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
