name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: black, secret scan, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The hub's package installs its own 3.13, so this pins the other end:
      # 3.11 is the oldest interpreter hub/pyproject.toml declares support for.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hub/pyproject.toml

      - run: pip install -e "hub[dev]"

      # The router's renderer tests check every case against the real
      # `dnsmasq --test`. dnsmasq-base is the binary without the service, so
      # nothing here contends with the runner's own resolver.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base

      - run: black --check hub agent client packaging

      # The scan reads what git would carry, so it needs the tree, not an
      # install. detect-secrets comes from the dev extra above.
      - run: nhub scan-secrets

      # The panel is not built here: app.py mounts it only when it exists.
      - run: pytest -q
        working-directory: hub

      - run: pytest -q
        working-directory: agent

  client:
    name: client tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 3.13 is what the client is compiled against on every platform.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e client/desktop pytest

      - run: pytest -q
        working-directory: client/desktop

  android:
    name: android tests, lint and ktlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # The NetBird, EasyTier and RustDesk libraries the app carries, kept under the
      # name the cores cache gives them: the core, its pinned commit, the ABI.
      - name: Name the cores
        id: cores_key
        run: echo "key=$(python3 packaging/build/build_client_android.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the phone cores
        id: cores
        uses: actions/cache@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.cores_key.outputs.key }}

      # The JNI side of the RustDesk core is compiled with the app.
      - name: Install the NDK and CMake the app builds with
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: actions/setup-go@v7
        if: steps.cores.outputs.cache-hit != 'true'
        with:
          go-version: "1.26.7"

      - name: Install what building the cores needs
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260816165457-f98cc9b3c733
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260816165457-f98cc9b3c733
          export PATH="$(go env GOPATH)/bin:${PATH}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
          cargo install cargo-ndk --locked
          sudo apt-get install -y nasm

      - name: Put the cores into the app
        run: |
          python3 packaging/build/build_core_netbird.py
          python3 packaging/build/build_core_easytier.py
          python3 packaging/build/build_core_rustdesk.py

      - run: ./gradlew --no-daemon ktlintCheck test lint
        working-directory: client/android

  # The two one-command installers, each held to its language's linter.
  install_scripts:
    name: shellcheck and PSScriptAnalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck packaging/install/install.sh

      - name: Invoke-ScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path packaging/install/install.ps1
          $found | Format-List RuleName, Severity, Line, Message
          if ($found) { throw "PSScriptAnalyzer found $(@($found).Count) issues" }

  agent_oldest_python:
    name: agent on Python 3.9
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The agent's package installs its own 3.13 too, and the agent source
      # declares 3.9, so a checkout on the oldest Raspbian has to run it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - run: pip install pytest

      - run: pytest -q
        working-directory: agent

  frontend:
    name: prettier, eslint, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      - run: npm ci
        working-directory: hub/frontend

      - run: npx prettier --check src
        working-directory: hub/frontend

      - run: npx eslint src --max-warnings 0
        working-directory: hub/frontend

      # `npm run build` runs `tsc -b` first, so this is the type check too.
      - run: npm run build
        working-directory: hub/frontend

  # The mainland tree build_sources.py --edition cn writes: the same suite
  # again where the features cn leaves out are not there.
  mainland_tree:
    name: mainland source tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: python3 packaging/build/build_sources.py --edition cn --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: cn_sources
          path: dist/*-cn-source.tar.gz
          if-no-files-found: error

  mainland_python:
    name: mainland tree, hub and agent tests
    needs: [mainland_tree]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xzf cn_sources/*-cn-source.tar.gz -C cn --strip-components=1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e "cn/hub[dev]"

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base

      - run: pytest -q
        working-directory: cn/hub

      - run: pytest -q
        working-directory: cn/agent

  mainland_client:
    name: mainland tree, client tests
    needs: [mainland_tree]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xzf cn_sources/*-cn-source.tar.gz -C cn --strip-components=1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e cn/client/desktop pytest

      - run: pytest -q
        working-directory: cn/client/desktop

  mainland_frontend:
    name: mainland tree, frontend build
    needs: [mainland_tree]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xzf cn_sources/*-cn-source.tar.gz -C cn --strip-components=1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cn/hub/frontend/package-lock.json

      - run: npm ci
        working-directory: cn/hub/frontend

      - run: npm run build
        working-directory: cn/hub/frontend
