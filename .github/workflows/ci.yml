name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: black, secret scan, tests
    runs-on: ubuntu-24.04
    # The Codecov uploads sign in with the job's OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The hub's package installs its own 3.13, so this pins the other end:
      # 3.11 is the oldest interpreter hub/pyproject.toml declares support for.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: hub/pyproject.toml

      - run: pip install -e "hub[dev]"

      # The router's renderer tests check every case against the real
      # `dnsmasq --test`. dnsmasq-base is the binary without the service, so
      # nothing here contends with the runner's own resolver.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base

      - run: black --check hub agent client packaging

      # The scan reads what git would carry, so it needs the tree, not an
      # install. detect-secrets comes from the dev extra above.
      - run: nhub scan-secrets

      # The panel is not built here: app.py mounts it only when it exists.
      - run: pytest -q --cov=neutrino_hub --cov-report=xml
        working-directory: hub

      - run: pytest -q --cov=neutrino_agent --cov-report=xml
        working-directory: agent

      # coverage.xml names each file from its package root, and the three
      # packages share names such as cli/entry.py, so each upload matches its
      # paths against its own package's files alone.
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: hub/coverage.xml
          flags: hub
          network_filter: hub/neutrino_hub/
          disable_search: true
          use_oidc: true

      - uses: codecov/codecov-action@v7.1.1
        with:
          files: agent/coverage.xml
          flags: agent
          network_filter: agent/neutrino_agent/
          disable_search: true
          use_oidc: true

  client:
    name: client tests
    runs-on: ubuntu-24.04
    # The Codecov upload signs in with the job's OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # 3.13 is what the client is compiled against on every platform.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e client/desktop pytest pytest-cov

      - run: pytest -q --cov=neutrino_client --cov-report=xml
        working-directory: client/desktop

      - uses: codecov/codecov-action@v7.1.1
        with:
          files: client/desktop/coverage.xml
          flags: client
          network_filter: client/desktop/neutrino_client/
          disable_search: true
          use_oidc: true

  android:
    name: android tests, lint and ktlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      # The NetBird, EasyTier and RustDesk libraries the app carries, kept under the
      # name the cores cache gives them: the core, its pinned commit, the ABI.
      - name: Name the cores
        id: cores_key
        run: echo "key=$(python3 packaging/build/build_client_android.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Cache the phone cores
        id: cores
        uses: actions/cache@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.cores_key.outputs.key }}

      # The JNI side of the RustDesk core is compiled with the app.
      - name: Install the NDK and CMake the app builds with
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: actions/setup-go@v7
        if: steps.cores.outputs.cache-hit != 'true'
        with:
          go-version: "1.26.7"

      - name: Install what building the cores needs
        if: steps.cores.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260816165457-f98cc9b3c733
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260816165457-f98cc9b3c733
          export PATH="$(go env GOPATH)/bin:${PATH}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
          cargo install cargo-ndk --locked
          sudo apt-get install -y nasm

      - name: Put the cores into the app
        run: |
          python3 packaging/build/build_core_netbird.py
          python3 packaging/build/build_core_easytier.py
          python3 packaging/build/build_core_rustdesk.py

      - run: ./gradlew --no-daemon ktlintCheck test lint
        working-directory: client/android

  # The iOS app: swift-format over the sources, then the unit tests on a
  # Simulator. The project is generated from client/ios/project.yml first.
  ios:
    name: ios tests and swift-format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - run: brew install xcodegen swift-format

      - run: swift-format lint --strict --recursive client/ios

      - run: xcodegen generate
        working-directory: client/ios

      # The first iPhone the runner's Simulator offers, by its id.
      - name: Pick a Simulator
        id: simulator
        run: |
          id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, found in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in found if d["name"].startswith("iPhone")))')"
          echo "id=${id}" >> "$GITHUB_OUTPUT"

      # TEST_RUNNER_NEUTRINO_SCREENS reaches the tests as NEUTRINO_SCREENS, where
      # ScreenshotTests and the UI tests write their PNG files. A test that needs
      # the whole Simulator screen, the keyboard's window with it, writes
      # <name>.shot there, and the loop below takes it as <name>.png. A test
      # that needs a recording of the screen writes <name>.rec, and the loop
      # starts <name>.mp4 and answers with <name>.recording once the recorder
      # prints that it has started; <name>.stop stops it with SIGINT, answered
      # with <name>.stopped once the recorder has ended. A recorder that has
      # not started or ended 120 seconds on is killed and its log printed, with
      # no answer. The Simulator gets no hardware keyboard, so the software
      # one comes up, and its slide-to-type introduction counts as seen.
      - name: Run the unit and UI tests
        working-directory: client/ios
        env:
          TEST_RUNNER_NEUTRINO_SCREENS: ${{ github.workspace }}/screens
          SIMULATOR: ${{ steps.simulator.outputs.id }}
        run: |
          screens="$TEST_RUNNER_NEUTRINO_SCREENS"
          mkdir -p "$screens"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl spawn "$SIMULATOR" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$SIMULATOR" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          simctl="$(xcrun --find simctl)"
          (
            while true; do
              for asked in "$screens"/*.shot; do
                [ -e "$asked" ] || continue
                xcrun simctl io "$SIMULATOR" screenshot "${asked%.shot}.tmp.png" > /dev/null 2>&1 || true
                mv "${asked%.shot}.tmp.png" "${asked%.shot}.png" || true
                rm -f "$asked"
              done
              for asked in "$screens"/*.rec; do
                [ -e "$asked" ] || continue
                name="${asked%.rec}"
                rm -f "$asked"
                "$simctl" io "$SIMULATOR" recordVideo --codec=h264 --force "$name.mp4" > "$name.log" 2>&1 &
                pid=$!
                began=$SECONDS
                while ! grep -q "Recording started" "$name.log" && kill -0 "$pid" 2> /dev/null \
                    && [ $((SECONDS - began)) -lt 120 ]; do
                  sleep 0.1
                done
                if grep -q "Recording started" "$name.log"; then
                  echo "the recording $name started after $((SECONDS - began)) s"
                  echo "$pid" > "$name.pid"
                  touch "$name.recording"
                else
                  kill -KILL "$pid" 2> /dev/null || true
                  echo "the recording $name did not start:"
                  cat "$name.log" || true
                  rm -f "$name.log"
                fi
              done
              for asked in "$screens"/*.stop; do
                [ -e "$asked" ] || continue
                name="${asked%.stop}"
                rm -f "$asked"
                [ -e "$name.pid" ] || continue
                pid="$(cat "$name.pid")"
                rm -f "$name.pid"
                kill -INT "$pid" 2> /dev/null || true
                began=$SECONDS
                while kill -0 "$pid" 2> /dev/null && [ $((SECONDS - began)) -lt 120 ]; do
                  sleep 0.1
                done
                if kill -0 "$pid" 2> /dev/null; then
                  kill -KILL "$pid" 2> /dev/null || true
                  echo "the recording $name did not stop:"
                  cat "$name.log" || true
                else
                  touch "$name.stopped"
                fi
                rm -f "$name.log"
              done
              sleep 0.1
            done
          ) &
          xcodebuild test \
            -project Neutrino.xcodeproj \
            -scheme Neutrino \
            -destination "id=$SIMULATOR" \
            -skipPackagePluginValidation \
            $(python3 ../../packaging/build/build_client_ios.py --build-settings)

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios_screens
          path: |
            screens/*.png
            screens/*.mp4
          if-no-files-found: warn

  # The iOS app built for a device with the RustDesk core linked in. The core
  # comes from the cores cache; on a miss it is built, in about a quarter of an
  # hour, and saved before the app is built.
  ios_core:
    name: ios device build with the RustDesk core
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Name the core
        id: core_key
        run: echo "key=$(python3 packaging/build/build_client_ios.py --cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore the core
        id: core
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.core_key.outputs.key }}

      - name: Install what building the core needs
        if: steps.core.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Put the core into the app
        run: python3 packaging/build/build_core_rustdesk_ios.py

      - name: Save the core
        if: steps.core.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/neutrino/cores
          key: ${{ steps.core_key.outputs.key }}

      - run: brew install xcodegen

      - run: xcodegen generate
        working-directory: client/ios

      - name: Build for a device
        working-directory: client/ios
        run: >
          xcodebuild build
          -project Neutrino.xcodeproj
          -scheme Neutrino
          -configuration Release
          -sdk iphoneos
          -destination generic/platform=iOS
          -derivedDataPath build/derived
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          $(python3 ../../packaging/build/build_client_ios.py --build-settings)

      - name: Check the app links the core
        run: nm client/ios/build/derived/Build/Products/Release-iphoneos/Neutrino.app/Neutrino | grep -E ' [Tt] _nd_attach_frames$'

      # The unsigned .ipa with the core, for the test on a phone.
      - name: Build the unsigned .ipa
        run: python3 packaging/build/build_client_ios.py --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: client_ios_device_test
          path: dist/*-ios.ipa
          if-no-files-found: error

  # The two one-command installers, each held to its language's linter.
  install_scripts:
    name: shellcheck and PSScriptAnalyzer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: shellcheck packaging/install/install.sh

      - name: Invoke-ScriptAnalyzer on install.ps1 and the agent's PowerShell host
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = @('packaging/install/install.ps1', 'agent/neutrino_agent/data/windows/powershell_host.ps1') | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ }
          $found | Format-List RuleName, Severity, Line, Message
          if ($found) { throw "PSScriptAnalyzer found $(@($found).Count) issues" }

  agent_oldest_python:
    name: agent on Python 3.9
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The agent's package installs its own 3.13 too, and the agent source
      # declares 3.9, so a checkout on the oldest Raspbian has to run it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - run: pip install pytest

      - run: pytest -q
        working-directory: agent

  # Containers' install on macOS: the pinned Podman pkg and machine image of
  # podman.json, driven through the agent's own code. No machine starts, since
  # the runners have no nested virtualisation.
  podman_macos:
    name: podman on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
    steps:
      - uses: actions/checkout@v7

      - name: Name the pinned files
        id: pins
        run: echo "key=$(python3 packaging/ci/podman_macos.py key ${{ matrix.platform }})" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned files
        uses: actions/cache@v6
        with:
          path: ~/.cache/neutrino/podman
          key: ${{ steps.pins.outputs.key }}

      - name: Fetch the pinned files and check their sha256
        run: python3 packaging/ci/podman_macos.py fetch ${{ matrix.platform }} "$HOME/.cache/neutrino/podman"

      # The installer and pkgutil need root; the machine's own commands run
      # as the runner's account, as the agent runs them.
      - name: Install Podman, make and size a machine, remove both
        run: sudo "$(command -v python3)" -I packaging/ci/podman_macos.py check ${{ matrix.platform }} "$HOME/.cache/neutrino/podman" "$USER" "$TMPDIR"

  frontend:
    name: prettier, eslint, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/frontend/package-lock.json

      - run: npm ci
        working-directory: hub/frontend

      - run: npx prettier --check src
        working-directory: hub/frontend

      - run: npx eslint src --max-warnings 0
        working-directory: hub/frontend

      # `npm run build` runs `tsc -b` first, so this is the type check too.
      - run: npm run build
        working-directory: hub/frontend

  # The mainland tree build_sources.py --edition cn writes: the same suite
  # again where the features cn leaves out are not there.
  mainland_tree:
    name: mainland source tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: python3 packaging/build/build_sources.py --edition cn --output-dir dist

      - uses: actions/upload-artifact@v7
        with:
          name: cn_sources
          path: dist/*-cn-source.tar.xz
          if-no-files-found: error

  mainland_python:
    name: mainland tree, hub and agent tests
    needs: [mainland_tree]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: pip install -e "cn/hub[dev]"

      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dnsmasq-base

      - run: pytest -q
        working-directory: cn/hub

      - run: pytest -q
        working-directory: cn/agent

  mainland_client:
    name: mainland tree, client tests
    needs: [mainland_tree]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -e cn/client/desktop pytest

      - run: pytest -q
        working-directory: cn/client/desktop

  mainland_frontend:
    name: mainland tree, frontend build
    needs: [mainland_tree]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cn_sources
          path: cn_sources

      - name: Unpack the mainland source tree
        run: mkdir cn && tar -xf cn_sources/*-cn-source.tar.xz -C cn --strip-components=1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cn/hub/frontend/package-lock.json

      - run: npm ci
        working-directory: cn/hub/frontend

      - run: npm run build
        working-directory: cn/hub/frontend
