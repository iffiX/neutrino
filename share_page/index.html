<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title></title>
<link rel="icon" id="icon" href="data:,">
<style>
  :root { color-scheme: light dark; --color-bg: #e8ebf0; --color-text: #0f172a; --color-text-muted: #5b6675; --color-accent: #0c6a84;
    --color-accent-wash: rgb(12 106 132 / 12%); --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace; }
  @media (prefers-color-scheme: dark) { :root { --color-bg: #070809; --color-text: #e6edf3; --color-text-muted: #8b96a5; --color-accent: #22d3ee; --color-accent-wash: rgb(34 211 238 / 12%); } }
  html, body { margin: 0; height: 100%; background: var(--color-bg); color: var(--color-text); font: 14px/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #screen { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--color-bg); }
  #screen .box { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 360px; }
  .mark { display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid var(--color-accent); border-radius: 10px; background: var(--color-accent-wash); box-shadow: 0 0 24px -10px var(--color-accent); }
  .mark svg { height: 23px; }
  .loading .mark { animation: splash_breathe 2.2s ease-in-out infinite; }
  @keyframes splash_breathe { 0%, 100% { box-shadow: 0 0 24px -10px var(--color-accent); opacity: .75; } 50% { box-shadow: 0 0 34px -6px var(--color-accent); opacity: 1; } }
  #title { margin: 0; font-size: 14px; font-weight: 500; }
  .loading #title { font: 12px/1.55 var(--font-mono); letter-spacing: .08em; color: var(--color-text-muted); }
  #detail { margin: -10px 0 0; font-size: 12px; color: var(--color-text-muted); text-wrap: balance; }
  .loading #detail, .hidden { display: none !important; }
</style>
</head>

<div id="screen">
  <div class="box loading" id="box">

    <h1 id="title"></h1>
    <p id="detail"></p>
  </div>
</div>
<iframe id="app" allow="fullscreen; clipboard-read; clipboard-write; camera; microphone"></iframe>
<script src="/__neutrino/shell.js"></script>
</body>
</html>
