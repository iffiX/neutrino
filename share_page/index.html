<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loading</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1f23; --bg: #f6f7f9; --muted: #6b7280; --accent: #3b6fd9; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e7ea; --bg: #141619; --muted: #9aa0a8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #fff; }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #screen .box { max-width: 360px; }
  #screen h1 { font-size: 18px; font-weight: 600; margin: 16px 0 6px; }
  #screen p { margin: 0; color: var(--muted); }
  .spinner { width: 28px; height: 28px; margin: 0 auto; border: 3px solid rgba(128,128,128,.25); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="screen">
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Loading</h1>
    <p id="detail"></p>
  </div>
</div>
<iframe id="app" allow="fullscreen; clipboard-read; clipboard-write; camera; microphone"></iframe>
<script src="/__neutrino/shell.js"></script>
</body>
</html>
