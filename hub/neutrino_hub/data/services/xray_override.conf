# Drop-in installed at /etc/systemd/system/xray.service.d/neutrino.conf
#
# Two things differ from the upstream unit: the config path points at the file
# neutrino renders, and the service keeps CAP_NET_ADMIN so it can open
# transparent (TPROXY) sockets and stamp its egress with a firewall mark.

[Unit]
After=neutrino_router.service
Wants=neutrino_router.service

[Service]
User=xray
Group=xray
ExecStart=
ExecStart=/usr/local/bin/xray run -config /etc/neutrino/generated/xray_config.json
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
NoNewPrivileges=true
Restart=on-failure
RestartSec=5
