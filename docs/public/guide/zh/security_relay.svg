<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="应用的数据经过客户端的 yamux 流到达中枢，中枢检查权限后把它和被控端上的另一条流拼接起来" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif'><defs><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="member" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker><marker id="guest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="limit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs><rect width="1200" height="680" fill="#ffffff"/><text x="150.0" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">你的设备</text><text x="600.0" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">中枢</text><text x="1050.0" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">应用所在的系统</text><rect x="20" y="54" width="260" height="360" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="72" width="220" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="150.0" y="111.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">浏览器或其他程序</text><polyline points="150,138 150,180" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="40" y="180" width="220" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="150.0" y="207.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">127.0.0.1:本机端口</text><text x="150.0" y="231.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">客户端监听</text><polyline points="150,246 150,298" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="40" y="298" width="220" height="96" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="150.0" y="340.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">neutrino_transport</text><text x="150.0" y="364.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">一个会话，多条流</text><rect x="920" y="54" width="260" height="360" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="940" y="72" width="220" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="1050.0" y="111.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">应用</text><polyline points="1050,180 1050,138" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="940" y="180" width="220" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="1050.0" y="207.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">127.0.0.1:应用端口</text><text x="1050.0" y="231.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">只连接已发布的端口</text><polyline points="1050,298 1050,246" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="940" y="298" width="220" height="96" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="1050.0" y="340.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">neutrino_transport</text><text x="1050.0" y="364.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">被控端的子进程</text><rect x="470" y="54" width="260" height="610" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="490" y="72" width="220" height="84" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="600.0" y="96.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">中枢 Python</text><text x="600.0" y="120.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">按权限判断</text><text x="600.0" y="144.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">返回目标</text><polyline points="600,158 600,268" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)" marker-start="url(#ink)"/><text x="612" y="204" font-size="16" font-weight="600" fill="#0f172a" text-anchor="start">打开流时询问</text><text x="612" y="228" font-size="16" font-weight="400" fill="#475569" text-anchor="start">传输时不询问</text><rect x="490" y="268" width="220" height="376" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="600" y="298" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">neutrino_transport</text><rect x="508" y="312" width="184" height="68" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="600.0" y="340.4" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">成员会话</text><text x="600.0" y="362.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">按权限检查每条流</text><text x="612" y="414" font-size="15" font-weight="600" fill="#dc2626" text-anchor="middle">两段加密各自独立，</text><text x="612" y="438" font-size="15" font-weight="400" fill="#dc2626" text-anchor="middle">中枢解密后再转发</text><rect x="508" y="462" width="184" height="52" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="600.0" y="493.4" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">在两条流之间复制字节</text><rect x="508" y="558" width="184" height="68" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="600.0" y="586.4" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">访客会话</text><text x="600.0" y="608.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">只能到分享的应用</text><polyline points="520,380 520,462" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)"/><polyline points="520,558 520,514" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="280" y="320" width="190" height="52" rx="26.0" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/><line x1="294" y1="333.0" x2="456" y2="333.0" stroke="#0e7490" stroke-width="2"/><line x1="294" y1="346.0" x2="456" y2="346.0" stroke="#0e7490" stroke-width="2"/><line x1="294" y1="359.0" x2="456" y2="359.0" stroke="#0e7490" stroke-width="2"/><polyline points="470,346 508,346" fill="none" stroke="#0e7490" stroke-width="4"/><text x="375" y="306" font-size="17" font-weight="600" fill="#0e7490" text-anchor="middle">TCP，Noise 加密</text><text x="375" y="398" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">yamux：网页、终端、</text><text x="375" y="420" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">文件、桌面各一条流</text><rect x="730" y="320" width="190" height="52" rx="26.0" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/><line x1="744" y1="333.0" x2="906" y2="333.0" stroke="#0e7490" stroke-width="2"/><line x1="744" y1="346.0" x2="906" y2="346.0" stroke="#0e7490" stroke-width="2"/><line x1="744" y1="359.0" x2="906" y2="359.0" stroke="#0e7490" stroke-width="2"/><polyline points="692,346 730,346" fill="none" stroke="#0e7490" stroke-width="4"/><text x="825" y="306" font-size="17" font-weight="600" fill="#0e7490" text-anchor="middle">TCP，Noise 加密</text><text x="825" y="398" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">被控端主动建立会话，</text><text x="825" y="420" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">中枢在会话上打开流</text><rect x="20" y="452" width="260" height="212" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="150" y="480" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">访客的浏览器</text><rect x="40" y="494" width="220" height="62" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="150.0" y="519.4" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">应用页面</text><text x="150.0" y="541.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">请求交给 Service Worker</text><polyline points="150,556 150,574" fill="none" stroke="#0f172a" stroke-width="2.5" marker-end="url(#ink)"/><rect x="40" y="574" width="220" height="62" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="150.0" y="599.4" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">shell.js</text><text x="150.0" y="621.4" font-size="14" font-weight="400" fill="#475569" text-anchor="middle">HTTP/1.1 放进 connect 流</text><rect x="280" y="566" width="190" height="52" rx="26.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><line x1="294" y1="579.0" x2="456" y2="579.0" stroke="#7c3aed" stroke-width="2"/><line x1="294" y1="592.0" x2="456" y2="592.0" stroke="#7c3aed" stroke-width="2"/><line x1="294" y1="605.0" x2="456" y2="605.0" stroke="#7c3aed" stroke-width="2"/><polyline points="470,592 508,592" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="375" y="552" font-size="17" font-weight="600" fill="#7c3aed" text-anchor="middle">TCP、DTLS、SCTP</text><text x="375" y="642" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">数据通道里的 yamux</text><circle cx="40" cy="72" r="14" fill="#0f172a"/><text x="40" y="78" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="40" cy="298" r="14" fill="#0f172a"/><text x="40" y="304" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="490" cy="72" r="14" fill="#0f172a"/><text x="490" y="78" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="730" cy="320" r="14" fill="#0f172a"/><text x="730" y="326" font-size="16" font-weight="700" fill