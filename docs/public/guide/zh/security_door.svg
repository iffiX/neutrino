<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="连接端口按首字节选择成员路径、访客路径或拒绝，通过校验之前中枢不写任何字节" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif'><defs><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="member" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker><marker id="guest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="limit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs><rect width="1200" height="610" fill="#ffffff"/><rect x="20" y="245" width="130" height="110" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="85.0" y="293.98" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">TCP 连接</text><text x="85.0" y="318.98" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">到达 8443</text><rect x="180" y="245" width="130" height="110" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="245.0" y="294.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">读取首字节</text><text x="245.0" y="318.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">读取时不回复</text><polyline points="150,300 180,300" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#grey)"/><text x="340" y="40" font-size="18" font-weight="700" fill="#0e7490" text-anchor="start">成员路径：客户端和被控端，持有加入链接</text><polyline points="310,275 325,275 325,110 340,110" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#member)"/><rect x="340" y="58" width="170" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="425.0" y="91.48" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">魔数</text><text x="425.0" y="116.48" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">这个中枢专属</text><text x="425.0" y="141.48000000000002" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">只比较字节</text><polyline points="510,110 530,110" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#member)"/><rect x="530" y="58" width="170" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="615.0" y="91.48" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">mac1</text><text x="615.0" y="116.48" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">校验值</text><text x="615.0" y="141.48000000000002" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">要有中枢公钥</text><polyline points="700,110 745,110" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#member)"/><rect x="745" y="58" width="130" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="810.0" y="91.48" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">mac2</text><text x="810.0" y="116.48" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">负载高时</text><text x="810.0" y="141.48000000000002" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">要求 cookie</text><polyline points="875,110 890,110" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#member)"/><rect x="890" y="58" width="150" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="965.0" y="92.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">Noise 消息 1</text><text x="965.0" y="116.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">DH 运算</text><text x="965.0" y="140.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">时间戳防重放</text><polyline points="1040,110 1055,110" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#member)"/><rect x="1055" y="58" width="125" height="104" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="1117.5" y="92.76" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">Noise 消息 2</text><text x="1117.5" y="115.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">询问 Python</text><text x="1117.5" y="138.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">yamux 会话</text><rect x="340" y="245" width="840" height="110" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="760" y="283" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">拒绝：所有失败都是同一种反应</text><text x="760" y="322" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">不写任何字节 → 随机读取一定数量的字节 → 随机保持一段时间 → 重置连接</text><polyline points="310,300 340,300" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><polyline points="425,162 425,245" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><polyline points="615,162 615,245" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><polyline points="965,162 965,245" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><polyline points="392,438 392,355" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><polyline points="517,438 517,355" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><polyline points="645,438 645,355" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><text x="340" y="586" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">访客路径：浏览器，持有分享链接，只在有生效的分享时开放</text><polyline points="310,325 325,325 325,490 340,490" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="340" y="438" width="105" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="392.5" y="484.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">STUN 帧</text><text x="392.5" y="508.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">检查格式</text><polyline points="445,490 465,490" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="465" y="438" width="105" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="517.5" y="484.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">ufrag</text><text x="517.5" y="508.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">查找分享</text><polyline points="570,490 590,490" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="590" y="438" width="110" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="645.0" y="484.26" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">HMAC</text><text x="645.0" y="507.26" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">校验完整性</text><polyline points="700,490 745,490" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="745" y="438" width="130" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="810.0" y="472.76" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">DTLS</text><text x="810.0" y="495.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">按链接里的</text><text x="810.0" y="518.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">指纹验证中枢</text><polyline points="875,490 890,490" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="890" y="438" width="150" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="965.0" y="472.76" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">SCTP 数据通道</text><text x="965.0" y="495.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">open 记录</text><text x="965.0" y="518.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">里的票据</text><polyline points="1040,490 1055,490" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><rect x="1055" y="438" width="125" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1117.5" y="472.76" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">yamux 会话</text><text x="1117.5" y="495.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">只到分享的</text><text x="1117.5" y="518.76" font-size="15" font-weight="400" fill="#475569" text-anchor="middle">这一个应用</text><polyline points="722,44 722,245" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6"/><polyline points="722,355 722,556" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 6"/><text x="734" y="40" font-size="18" font-weight="700" fill="#dc2626" text-anchor="start">这条线之前，中枢不写任何字节</text></svg>
