<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="客户端、手机 App 和被控端用 Noise 连接中枢的同一个端口，浏览器访客用 WebRTC 连接这个端口" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif'><defs><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="member" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker><marker id="guest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="limit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs><rect width="1200" height="760" fill="#ffffff"/><text x="190.0" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">客户端</text><text x="495.0" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">外部访问</text><text x="790.0" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">中枢所在的系统</text><text x="1082.5" y="36" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">加入中枢的其他系统</text><rect x="30" y="56" width="320" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="190" y="86" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">桌面客户端</text><text x="190" y="113" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">常驻进程和窗口：Python</text><rect x="50" y="128" width="280" height="52" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="190.0" y="160.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">neutrino_transport 子进程</text><rect x="30" y="214" width="320" height="140" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="190" y="244" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">手机 App</text><text x="190" y="271" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">界面：Kotlin、Swift</text><rect x="50" y="286" width="280" height="52" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="190.0" y="318.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">同一份 Go 代码，以库嵌入</text><rect x="30" y="372" width="320" height="168" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="190" y="402" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">浏览器访客（特殊客户端）</text><text x="190" y="429" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">分享页：纯 JavaScript</text><text x="190" y="454" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">没有 Go 传输层</text><rect x="50" y="470" width="280" height="52" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="190.0" y="502.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">浏览器自带的 WebRTC</text><rect x="30" y="610" width="320" height="84" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/><text x="190.0" y="646.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">分享站</text><text x="190.0" y="670.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">只提供静态页面，可以自行部署</text><polyline points="190,610 190,542" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#grey)"/><text x="204" y="582" font-size="16" font-weight="400" fill="#475569" text-anchor="start">加载页面，# 后面的内容不发送</text><rect x="405" y="56" width="180" heigh