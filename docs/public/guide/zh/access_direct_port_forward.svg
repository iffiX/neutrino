<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="外部网络的客户端和访客连接路由器的公网地址和端口 8443，路由器把它转发到中枢所在电脑的连接端口 8443" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif'><defs><marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="member" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7490"/></marker><marker id="guest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="limit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs><rect width="1040" height="330" fill="#ffffff"/><rect x="20" y="20" width="280" height="290" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="160.0" y="52" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">外部网络</text><rect x="44" y="78" width="232" height="88" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="160.0" y="116.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">客户端</text><text x="160.0" y="140.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">手机或电脑上的微子</text><rect x="44" y="196" width="232" height="88" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="160.0" y="234.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">访客的浏览器</text><text x="160.0" y="258.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">打开分享链接</text><rect x="420" y="88" width="180" height="186" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="510.0" y="149.98" font-size="18" font-weight="600" fill="#0f172a" text-anchor="middle">路由器</text><text x="510.0" y="174.98" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">你的公网地址</text><text x="510.0" y="199.98" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">端口转发</text><text x="510.0" y="224.98" font-size="17" font-weight="400" fill="#475569" text-anchor="middle">TCP 8443</text><rect x="740" y="20" width="280" height="290" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="880.0" y="52" font-size="19" font-weight="700" fill="#0f172a" text-anchor="middle">家里的局域网</text><rect x="764" y="120" width="232" height="120" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/><text x="880.0" y="162.12" font-size="17" font-weight="600" fill="#0f172a" text-anchor="middle">中枢所在的电脑</text><text x="880.0" y="186.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">192.168.1.20</text><text x="880.0" y="210.12" font-size="16" font-weight="400" fill="#475569" text-anchor="middle">连接端口 8443</text><polyline points="276,122 420,150" fill="none" stroke="#0e7490" stroke-width="2.5" marker-end="url(#member)"/><polyline points="276,240 420,212" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#guest)"/><text x="356" y="104" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">公网地址:8443</text><polyline points="600,180 764,180" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#grey)"/><text x="682" y="164" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">转发到</text><text x="682" y="206" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">192.168.1.20:8443</text></svg>
